services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: binkcity
    volumes:
      - pg-data:/var/lib/postgresql/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      CLUBGG_AGENT_USERNAME: ${CLUBGG_AGENT_USERNAME}
      CLUBGG_AGENT_PASSWORD: ${CLUBGG_AGENT_PASSWORD}
      APPIUM_SERVER: ${APPIUM_SERVER:-http://host.docker.internal:4723}
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
